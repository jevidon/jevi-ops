packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ build-script approval. esbuild backs tsx-watch and Next.js dev;
# sharp is Next.js's image optimizer; unrs-resolver backs eslint-config-next's
# import resolution (PR-6 lint setup). All required for dev/build/lint.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
