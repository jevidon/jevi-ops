name: JeviOps
options:
  bundleIdPrefix: com.jevidon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Xcode's "recommended settings" — declared here because the generated
    # .xcodeproj is disposable; performing them in Xcode would not stick.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  JeviOps:
    type: application
    platform: iOS
    sources:
      - JeviOps
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevidon.jeviops
        INFOPLIST_FILE: JeviOps/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: JeviOps/Support/JeviOps.entitlements
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevidon.jeviops.share
        INFOPLIST_FILE: ShareExtension/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Support/ShareExtension.entitlements

  JeviOpsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JeviOps

schemes:
  JeviOps:
    build:
      targets:
        JeviOps: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JeviOpsUITests
    archive:
      config: Release
